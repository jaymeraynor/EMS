# Serves the static frontend and proxies /api/ to the backend (same origin -> no CORS needed).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Terminate TLS in front of this container and uncomment:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        # The backend enforces the exact 10 MiB CSV file limit; multipart framing adds overhead,
        # so allow headroom here (a body at the limit must not get a proxy-generated 413).
        client_max_body_size 11m;
        # Re-resolve "api" at request time (Docker's embedded DNS) so a recreated api container
        # with a new IP is picked up without reloading nginx. A variable in proxy_pass forces this;
        # with no URI part the original request URI is passed through unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
